<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRM заявок | Khashuri Marketplace</title>
<style>
:root{--teal:#11877c;--ink:#131c31;--muted:#70798b;--line:#e1e5ea;--bg:#f4f6f9;--soft:#eaf8f5;--red:#b63a3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:center}.back{width:50px;height:50px;border:1px solid var(--line);background:#fff;border-radius:17px;font-size:28px}.top h1{font-size:24px;margin:0}.wrap{max-width:940px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#10233c,#0b7d73);color:#fff;border-radius:26px;padding:24px}.hero h2{font-size:31px;margin:0 0 8px}.hero p{margin:0;opacity:.9;line-height:1.45}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}.card h3{font-size:21px;margin:0 0 10px}.muted{color:var(--muted);line-height:1.45}.sharebox{display:flex;gap:8px}.sharebox input{flex:1;min-width:0;border:1px solid var(--line);border-radius:13px;padding:13px;font:inherit}.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--teal);color:#fff;font-weight:900;font-size:15px}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.toolbar select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font:inherit}.lead{border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:10px}.leadTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.lead h4{margin:0;font-size:19px}.lead .price{font-size:24px;font-weight:950;margin:8px 0}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:7px 14px;color:#586173;font-size:13px}.meta b{color:var(--ink)}.leadActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.leadActions select{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;font:inherit}.empty{padding:22px;text-align:center;color:var(--muted)}.status{font-weight:850;padding:6px 9px;border-radius:999px;background:var(--soft);color:#0c7169}.warn{background:#fff7e7;color:#945d00;border:1px solid #f1dfb8;border-radius:16px;padding:13px;line-height:1.45}.error{color:var(--red)}@media(max-width:650px){.top h1{font-size:21px}.wrap{padding:13px}.sharebox{display:grid}.leadTop{display:grid}.meta{grid-template-columns:1fr}.hero h2{font-size:28px}}
</style>
</head>
<body>
<header class="top"><button class="back" onclick="history.length>1?history.back():location.href='/valuation'">←</button><h1>📥 CRM заявок</h1></header>
<main class="wrap"><section class="hero"><h2>Заявки на продажу</h2><p>Персональная ссылка для клиентов, контакты владельцев и статусы обработки в одном месте.</p></section>
<section class="card"><h3>🔗 Ссылка для клиентов</h3><p class="muted">Клиент открывает эту ссылку, делает оценку и после результата может оставить имя и телефон. Заявка попадёт только в твою CRM.</p><div class="sharebox"><input id="shareUrl" readonly placeholder="Загружаю персональную ссылку…"><button class="btn" id="copyBtn" type="button">Копировать</button></div><div id="shareMsg" class="muted" style="margin-top:8px"></div></section>
<section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h3 style="margin:0">Заявки</h3><button class="btn alt" id="refreshBtn" type="button">Обновить</button></div><div class="toolbar"><select id="filter"><option value="all">Все статусы</option><option value="new">Новые</option><option value="contacted">Связались</option><option value="working">В работе</option><option value="closed">Закрытые</option></select><span id="count" class="muted"></span></div><div id="state" class="empty">Загружаю…</div><div id="list"></div></section></main>
<script>
const SB='https://eppyjmtowtkxcwwhvwzp.supabase.co',KEY='sb_publishable_3oEkPaexOGYojb-9imVJjw_2SCQ7WRr';
const $=id=>document.getElementById(id),statusNames={new:'Новая',contacted:'Связались',working:'В работе',closed:'Закрыта'};let session=null,rows=[];
function safe(v){try{return JSON.parse(v||'null')}catch(e){return null}}function norm(x){if(!x)return null;return x.access_token?x:(x.currentSession||x.session||x.data?.session||null)}function payload(t){try{let s=String(t||'').split('.')[1].replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(atob(s))}catch(e){return{}}}
function sessions(){const out=[];for(const st of [sessionStorage,localStorage]){try{for(let i=0;i<st.length;i++){const k=st.key(i)||'',s=norm(safe(st.getItem(k)));if(!s?.access_token)continue;const p=payload(s.access_token),iss=String(p.iss||'');if(p.ref==='eppyjmtowtkxcwwhvwzp'||iss.includes('eppyjmtowtkxcwwhvwzp.supabase.co/auth/v1'))out.push(s)}}catch(e){}}return out.sort((a,b)=>Number(payload(b.access_token).exp||0)-Number(payload(a.access_token).exp||0))}
async function getSession(){for(const s of sessions()){try{const r=await fetch(SB+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+s.access_token}});if(r.ok)return s}catch(e){}}return null}
function auth(){return session?{apikey:KEY,Authorization:'Bearer '+session.access_token,'content-type':'application/json'}:{apikey:KEY,'content-type':'application/json'}}
async function token(){const r=await fetch(SB+'/rest/v1/rpc/get_or_create_valuation_public_token',{method:'POST',headers:auth(),body:'{}'});if(!r.ok)throw new Error(r.status===404?'CRM migration not applied':'token '+r.status);let t=await r.json();t=String(t||'').replace(/^"|"$/g,'');return t}
async function makeShare(){try{const t=await token(),url=location.origin+'/valuation/new?mode=precise&public=1&ref='+encodeURIComponent(t);$('shareUrl').value=url;$('shareMsg').textContent='Персональная ссылка готова.'}catch(e){$('shareUrl').value='';$('shareMsg').innerHTML='<span class="error">CRM ещё не активирована в Supabase.</span>'}}
async function load(){if(!session){$('state').innerHTML='<div class="warn">Нужно войти в Khashuri Marketplace под своим аккаунтом, чтобы открыть CRM.</div>';return}try{const r=await fetch(SB+'/rest/v1/valuation_leads?select=*&order=created_at.desc&limit=200',{headers:auth()});if(!r.ok)throw new Error('load '+r.status);rows=await r.json();render()}catch(e){$('state').innerHTML='<div class="warn">CRM-контур подготовлен, но таблица заявок ещё не активирована в Supabase.</div>';}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(v){return v?'$'+Math.round(Number(v)).toLocaleString('en-US'):'—'}
function render(){const f=$('filter').value,a=f==='all'?rows:rows.filter(x=>x.status===f);$('state').style.display='none';$('count').textContent=a.length+' заявок';$('list').innerHTML=a.length?a.map(x=>`<article class="lead" data-id="${esc(x.id)}"><div class="leadTop"><div><h4>${esc(x.client_name)}</h4><div class="muted">${esc(x.phone)} · ${esc(x.contact_method||'phone')}</div></div><span class="status">${statusNames[x.status]||x.status}</span></div><div class="price">${money(x.estimated_value)}</div><div class="meta"><div><b>Кадастр:</b> ${esc(x.cadastral_code||'—')}</div><div><b>Город:</b> ${esc(x.city||'—')}</div><div><b>Адрес:</b> ${esc(x.address||'—')}</div><div><b>Цена владельца:</b> ${money(x.owner_price)}</div><div><b>Дата:</b> ${new Date(x.created_at).toLocaleString('ru-RU')}</div><div><b>Язык:</b> ${(x.language||'ru').toUpperCase()}</div></div>${x.comment?`<p class="muted"><b>Комментарий:</b> ${esc(x.comment)}</p>`:''}<div class="leadActions"><select onchange="setStatus('${esc(x.id)}',this.value)">${Object.entries(statusNames).map(([v,n])=>`<option value="${v}" ${v===x.status?'selected':''}>${n}</option>`).join('')}</select><a class="btn alt" href="tel:${encodeURIComponent(x.phone||'')}" style="text-decoration:none">Позвонить</a></div></article>`).join(''):'<div class="empty">Заявок с таким статусом пока нет.</div>'}
async function setStatus(id,status){const r=await fetch(SB+'/rest/v1/valuation_leads?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...auth(),Prefer:'return=minimal'},body:JSON.stringify({status,updated_at:new Date().toISOString()})});if(r.ok){const x=rows.find(v=>v.id===id);if(x)x.status=status;render()}else alert('Статус не обновился')}
$('copyBtn').onclick=async()=>{const v=$('shareUrl').value;if(!v)return;try{await navigator.clipboard.writeText(v);$('shareMsg').textContent='✅ Ссылка скопирована'}catch(e){$('shareUrl').select();document.execCommand('copy')}};$('refreshBtn').onclick=load;$('filter').onchange=render;
(async()=>{session=await getSession();if(!session){$('state').innerHTML='<div class="warn">Сначала войди в аккаунт Khashuri Marketplace. После входа открой CRM снова.</div>';return}await makeShare();await load()})();
</script></body></html>
