    const s=sums();const own=admin()?db.txs:db.txs.filter(x=>String(x.flat)===String(db.flat)||(!x.flat&&x.type==='expense'));
    const txRows=own.slice().reverse().map(q=>`<tr><td>${e(q.date)}</td><td>${e(q.description)}</td><td>${e(q.type==='income'?t('incomeType'):t('expenseType'))}</td><td>${q.flat?'№ '+q.flat:'—'}</td><td class="${q.type==='income'?'text-green':'text-red'}"><strong>${cash(q.amount)}</strong></td></tr>`).join('')||`<tr><td colspan="5">${e(t('none'))}</td></tr>`;
    const form=admin()?`<form id="tx-form" class="form"><div class="field"><label>${e(t('type'))}</label><select name="type"><option value="income">${e(t('incomeType'))}</option><option value="expense">${e(t('expenseType'))}</option></select></div><div class="field"><label>${e(t('amount'))}</label><input required min="0.01" step="0.01" type="number" name="amount" /></div><div class="field"><label>${e(t('description'))}</label><input required name="description" maxlength="120" /></div><div class="field"><label>${e(t('associatedFlat'))}</label><input name="flat" type="number" min="1" max="60" /></div><div class="field"><label>${e(t('paymentPurpose'))}</label><select name="purpose"><option value="fee">${e(t('feePayment'))}</option><option value="other">${e(t('otherPayment'))}</option></select></div><div class="field"><label>${e(t('feePeriod'))}</label><input name="period" type="month" value="${todayMonth()}" /></div><div class="field all"><button class="btn" type="submit">+ ${e(t('add'))}</button></div></form>`:`<div class="items">${reportItem({title:t('ownFlat'),sub:t('myHistory'),right:'№ '+db.flat})}${reportItem({title:t('myFee'),sub:t('monthFee'),right:db.fee?cash(db.fee):t('notSet')})}${reportItem({title:t('myPaid'),sub:todayMonth(),right:cash(currentMonthPayments(db.flat))})}</div>`;
    return `<div class="grid four" style="margin-bottom:16px">${metric('₾',t('balance'),cash(s.income-s.expense))}${metric('↗',t('income'),cash(s.income))}${metric('↘',t('expense'),cash(s.expense))}${metric('◉',t('monthFee'),db.fee?cash(db.fee):t('notSet'))}</div><div class="notice">${e(t('ledgerNotice'))}</div><div class="grid two">${box(admin()?t('txNew'):t('myHistory'),form)}${box(t('overview'),`<div class="items">${reportItem({title:t('income'),right:cash(s.income),class:'text-green'})}${reportItem({title:t('expense'),right:cash(s.expense),class:'text-red'})}${reportItem({title:t('balance'),right:cash(s.income-s.expense)})}</div>`)}</div><div class="section-gap">${box(t('tx'),`<div class="table-scroll"><table class="table"><thead><tr><th>${e(t('date'))}</th><th>${e(t('description'))}</th><th>${e(t('type'))}</th><th>${e(t('flat'))}</th><th>${e(t('amount'))}</th></tr></thead><tbody>${txRows}</tbody></table></div>`,admin()?`<button class="btn secondary small" data-export-csv>↓ ${e(t('report'))}</button>`:'')}</div>`;
  };
  const repairs=()=>{
    const tickets=db.tickets.slice().reverse().map(q=>`<div class="item"><div><strong>⚒ ${e(q.title)}</strong><small>${e(q.text)} · № ${q.flat} · ${e(q.date)}</small></div><div style="display:grid;gap:7px;justify-items:end"><span class="pill ${e(q.status)}">${e(t(q.status))}</span>${admin()?`<select class="filter" style="width:125px;font-size:11px;padding:6px" data-ticket="${e(q.id)}"><option value="open" ${q.status==='open'?'selected':''}>${e(t('open'))}</option><option value="progress" ${q.status==='progress'?'selected':''}>${e(t('progress'))}</option><option value="done" ${q.status==='done'?'selected':''}>${e(t('done'))}</option></select>`:''}</div></div>`).join('')||empty();
    const form=`<form id="ticket-form" class="form"><div class="field all"><label>${e(t('subject'))}</label><input name="title" required maxlength="100" /></div><div class="field all"><label>${e(t('details'))}</label><textarea name="text" required maxlength="600"></textarea></div><div class="field all"><label>${e(t('flat'))}</label><input name="flat" type="number" min="1" max="60" value="${admin()?'':db.flat}" required /></div><div class="field all"><button class="btn green" type="submit">+ ${e(t('ticketNew'))}</button></div></form>`;
    return `<div class="grid two">${box(t('tickets'),`<div class="items">${tickets}</div>`)}${box(t('ticketNew'),form)}</div>`;
  };
  const polls=()=>{
    const list=db.polls.slice().reverse().map(q=>{const total=q.yes+q.no,pc=total?Math.round(q.yes/total*100):0,voted=q.voters.includes(db.flat);
      return `<div class="poll"><h3>${e(q.question)}</h3><span class="sub">${e(q.date)} · ${total} ${e(t('votes'))}</span><div class="meter"><span style="width:${pc}%"></span></div><div class="pill-row"><span class="pill done">${e(t('yes'))}: ${q.yes}</span><span class="pill">${e(t('no'))}: ${q.no}</span></div>${!admin()?`<div class="poll-buttons"><button class="btn green small" data-vote="${e(q.id)}" data-choice="yes" ${voted?'disabled':''}>${e(t('yes'))}</button><button class="btn secondary small" data-vote="${e(q.id)}" data-choice="no" ${voted?'disabled':''}>${e(t('no'))}</button>${voted?`<span class="pill done">${e(t('voted'))}</span>`:''}</div>`:''}</div>`;
    }).join('')||empty();
    return `<div class="notice">${e(t('pollNotice'))}</div><div class="grid two">${box(t('polls'),`<div class="items">${list}</div>`)}${admin()?box(t('pollNew'),`<form id="poll-form" class="form"><div class="field all"><label>${e(t('pollQuestion'))}</label><textarea name="question" maxlength="250" required></textarea></div><div class="field all"><button class="btn" type="submit">+ ${e(t('add'))}</button></div></form>`):box(t('residentHome'),`<p class="help">${e(t('demo'))}</p>`)}</div>`;
  };
  const news=()=>{
    const list=db.posts.slice().reverse().map(q=>reportItem({title:'📣 '+q.title,sub:q.text+' · '+q.date})).join('')||empty();
    return `<div class="grid two">${box(t('posts'),`<div class="items">${list}</div>`)}${admin()?box(t('postNew'),`<form id="post-form" class="form"><div class="field all"><label>${e(t('subject'))}</label><input name="title" required maxlength="100" /></div><div class="field all"><label>${e(t('details'))}</label><textarea name="text" required maxlength="600"></textarea></div><div class="field all"><button class="btn" type="submit">+ ${e(t('add'))}</button></div></form>`):''}</div>`;
  };

  const applicationState=q=>q.status==='approved'?t('approvedReview'):q.status==='rejected'?t('rejectedReview'):t('pendingReview');
  const registration=()=>{
    if(admin())return applications();
    const prior=db.applications.find(q=>q.demoProfile==='demo_local_user');
    const head='<div class="notice danger-notice">🔒 '+e(t('testNotice'))+'</div>';
    const prev=prior?`<div class="profile-card"><div class="profile-avatar">♙</div><div><strong>${e(prior.name)}</strong><small>${e(t('entrance'))} №${prior.entrance} · ${e(t('flat'))} №${prior.flat} · ${e(t(prior.type==='owner'?'owner':'tenant'))}</small></div><span class="pill ${prior.status==='approved'?'done':'progress'}">${e(applicationState(prior))}</span></div><p class="small-help">${e(t('localWarning'))}</p>`:'';
    const form=prior?`<div class="empty">◎ ${e(t('applicationExisting'))}</div>`:`<p class="help">${e(t('registrationHelp'))}</p><form id="registration-form" class="form"><div class="field all"><label>${e(t('demoName'))}</label><input name="name" placeholder="${e(t('demoNamePlaceholder'))}" maxlength="50" required autocomplete="off"/></div><div class="field"><label>${e(t('entrance'))}</label><select name="entrance"><option value="1">№1</option><option value="2">№2</option><option value="3">№3</option></select></div><div class="field"><label>${e(t('flat'))}</label><select name="flat">${db.units.map(q=>`<option value="${q.number}">№ ${q.number}</option>`).join('')}</select></div><div class="field all"><label>${e(t('residentType'))}</label><select name="type"><option value="owner">${e(t('owner'))}</option><option value="resident">${e(t('tenant'))}</option></select></div><div class="field all"><p class="small-help">📱 ${e(t('phoneLater'))}</p></div><div class="field all"><label class="check-label"><input type="checkbox" name="demoOnly" value="yes" required/> ${e(t('testNotice'))}</label></div><div class="field all"><button class="btn green" type="submit">${e(t('submitApplication'))} →</button></div></form>`;
    return head+`<div class="grid two">${box(t('registrationTitle'),form)}${box(t('myApplication'),prev||'<p class="help">'+e(t('localWarning'))+'</p><div class="empty">'+e(t('none'))+'</div>')}</div>`;
  };
  const applications=()=>{
    if(!admin())return registration();
    const waiting=db.applications.filter(q=>q.status==='pending').length;
    const list=db.applications.slice().reverse().map(q=>`<div class="review-row"><div class="profile-card"><div class="profile-avatar">♙</div><div><strong>${e(q.name)}</strong><small>${e(t(q.type==='owner'?'owner':'tenant'))} · ${e(t('entrance'))} №${q.entrance} · ${e(t('flat'))} №${q.flat}</small><small>${e(q.date)}</small></div></div><div class="review-actions"><span class="pill ${q.status==='approved'?'done':'progress'}">${e(applicationState(q))}</span>${q.status==='pending'?`<button class="btn green small" data-review="${e(q.id)}" data-review-status="approved">✓ ${e(t('approve'))}</button><button class="btn danger small" data-review="${e(q.id)}" data-review-status="rejected">✕ ${e(t('reject'))}</button>`:''}</div></div>`).join('')||empty();
    return `<div class="notice">⚠ ${e(t('localWarning'))} ${e(t('testNotice'))}</div><div class="grid two">${box(t('applicationReview'),`<div class="stat-strip"><b>${waiting}</b><span>${e(t('pendingReview'))}</span></div><div class="items">${list}</div>`)}${box(t('registrationDemo'),`<p class="help">${e(t('registrationHelp'))}</p><div class="pill-row"><button class="btn green" data-role="resident" data-registration>♙ ${e(t('registration'))}</button></div>`)}</div>`;
  };
  const settings=()=>!admin()?box(t('settings'),`<div class="notice">${e(t('adminOnly'))}</div>`):`<div class="grid two">${box(t('setFee'),`<p class="help">${e(t('feeNotice'))}</p><form id="settings-form" class="form"><div class="field"><label>${e(t('amount'))}</label><input type="number" step="0.01" min="0" max="100000" name="fee" value="${e(db.fee)}" required /></div><div class="field" style="align-self:end"><button class="btn green" type="submit">${e(t('save'))}</button></div></form><div class="pill-row section-gap"><button class="btn secondary small" data-backup>↓ ${e(t('exportBackup'))}</button><button class="btn danger small" data-reset>${e(t('reset'))}</button></div>`)}${box(t('floorMap'),floors())}</div>`;
  function render(){
    document.documentElement.lang=db.lang;
    const nav=sections.filter(k=>admin()?k!=='registration':k!=='applications').map(k=>`<button class="nav-btn ${db.tab===k?'active':''}" data-nav="${k}"><span class="i">${icons[k]}</span>${e(t(k))}</button>`).join('');
    const mobile=['home','apartments','finances','repairs'].map(k=>`<button data-nav="${k}" class="${db.tab===k?'active':''}"><span class="i">${icons[k]}</span>${e(t(k))}</button>`).join('')+`<button data-more class="${moreOpen||['guide','polls','news','settings','registration','applications'].includes(db.tab)?'active':''}"><span class="i">☷</span>${e(t('more'))}</button>`;
    const tabs={home,guide,apartments,finances,repairs,polls,news,settings,registration,applications};
    el.innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">⌂</div><div><strong>ჩვენი კორპუსი</strong><small>რუსთაველის 16 · ხაშური</small></div></div><nav class="nav">${nav}</nav><div class="side-foot">🔒 ${e(t('security'))}</div></aside><main class="main"><header class="top"><div><span class="eyebrow">${e(t('address'))}</span><div class="top-name">${e(t('building'))}</div></div><div class="switches"><button class="switch ${admin()?'selected':''}" data-role="admin">${e(t('admin'))}</button><button class="switch ${!admin()?'selected':''}" data-role="resident">${e(t('resident'))}</button><button class="switch" data-lang="${db.lang==='ka'?'ru':'ka'}">${db.lang==='ka'?'🇷🇺 RU':'🇬🇪 KA'}</button></div></header><div class="wrap"><div class="page-heading"><div><span class="eyebrow">${e(admin()?t('overview'):t('residentHome'))}</span><h1>${e(t(db.tab))}</h1><p>${e(t('house'))}</p></div><span class="badge">● ${e(t(db.role))}</span></div><div class="notice">⚠ ${e(t('demo'))}</div>${tabs[db.tab]?.()||home()}<div class="footer-note">${e(t('security'))}</div></div></main><nav class="bottom">${mobile}</nav>${moreOpen?`<div class="more-backdrop" data-more-close></div><div class="more-sheet"><b>${e(t('more'))}</b>${['guide','polls','news','settings',admin()?'applications':'registration'].map(k=>`<button data-nav="${k}" class="${db.tab===k?'active':''}"><span>${icons[k]}</span>${e(t(k))}</button>`).join('')}</div>`:''}</div>`;
  }
  function download(filename,mime,contents){const blob=new Blob([contents],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}
  function csv(){const rows=[['date','type','description','flat','amount','purpose','period'],...db.txs.map(q=>[q.date,q.type,q.description,q.flat||'',q.amount,q.purpose||'',q.period||''])];download('rustaveli16-cashbook.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'));}
  const formValues=form=>Object.fromEntries(new FormData(form).entries());
  document.addEventListener('submit',ev=>{
    if(!ev.target.matches('form[id$="-form"]'))return;ev.preventDefault();const f=ev.target,d=formValues(f);
    if(f.id==='shop-form'){if(!admin())return notify(t('adminOnly'));if(!d.name.trim())return notify(t('invalid'));db.shops.push({id:uid(),name:d.name.trim()});}
    else if(f.id==='tx-form'){if(!admin())return notify(t('adminOnly'));const amount=Number(d.amount),flat=d.flat?Number(d.flat):null;const type=d.type==='expense'?'expense':'income',purpose=type==='income'&&d.purpose==='fee'?'fee':'other';if(!Number.isFinite(amount)||amount<=0||!d.description.trim()||(flat!==null&&(!Number.isInteger(flat)||flat<1||flat>60))||(purpose==='fee'&&(!flat||!/^\d{4}-(0[1-9]|1[0-2])$/.test(d.period))))return notify(t('invalid'));db.txs.push({id:uid(),type,amount,description:d.description.trim(),flat,purpose,period:purpose==='fee'?d.period:null,date:now()});}
    else if(f.id==='ticket-form'){const flat=Number(d.flat);if(!Number.isInteger(flat)||flat<1||flat>60||!d.title.trim()||!d.text.trim())return notify(t('invalid'));db.tickets.push({id:uid(),flat,title:d.title.trim(),text:d.text.trim(),status:'open',date:now()});}
    else if(f.id==='poll-form'){if(!admin())return notify(t('adminOnly'));if(!d.question.trim())return notify(t('invalid'));db.polls.push({id:uid(),question:d.question.trim(),yes:0,no:0,voters:[],date:now()});}
    else if(f.id==='post-form'){if(!admin())return notify(t('adminOnly'));if(!d.title.trim()||!d.text.trim())return notify(t('invalid'));db.posts.push({id:uid(),title:d.title.trim(),text:d.text.trim(),date:now()});}
    else if(f.id==='registration-form'){
      if(admin())return notify(t('adminOnly'));
      if(db.applications.some(q=>q.demoProfile==='demo_local_user'))return notify(t('applicationExisting'));
      if(d.demoOnly!=='yes'||!d.name.trim()||d.name.length>50||!['1','2','3'].includes(d.entrance)||!Number.isInteger(Number(d.flat))||Number(d.flat)<1||Number(d.flat)>60||!['owner','resident'].includes(d.type))return notify(t('invalid'));
      db.applications.push({id:uid(),demoProfile:'demo_local_user',name:d.name.trim(),entrance:Number(d.entrance),flat:Number(d.flat),type:d.type,status:'pending',date:now()});
      db.flat=Number(d.flat);
      persist();render();notify(t('requestSent'));return;
    }
    else if(f.id==='settings-form'){if(!admin())return notify(t('adminOnly'));const amount=Number(d.fee);if(!Number.isFinite(amount)||amount<0||amount>100000)return notify(t('invalid'));db.fee=amount;}
    else return;
    persist();render();notify(t('saved'));
  });
  document.addEventListener('change',ev=>{
    const x=ev.target;
    if(x.dataset.unit&&admin()){const rec=db.units.find(q=>q.number===Number(x.dataset.unit));if(rec&&['floor','entrance'].includes(x.dataset.edit)){rec[x.dataset.edit]=Number(x.value);selectedUnit=rec.number;if(rec.entrance)db.entranceView=rec.entrance;persist();render();if(x.closest('.unit-details'))document.querySelector('.unit-details')?.scrollIntoView({block:'nearest'});}}
    if(x.dataset.ticket&&admin()){const rec=db.tickets.find(q=>q.id===x.dataset.ticket);if(rec&&['open','progress','done'].includes(x.value)){rec.status=x.value;persist();render();}}
    if(x.id==='demo-flat'){db.flat=Number(x.value);persist();render();}
  });
  document.addEventListener('input',ev=>{
    if(ev.target.id!=='search')return;
    db.search=ev.target.value;const cursor=ev.target.selectionStart;render();const el=document.getElementById('search');el?.focus();el?.setSelectionRange(cursor,cursor);
  });
  document.addEventListener('click',ev=>{
    const x=ev.target.closest('[data-nav],[data-role],[data-lang],[data-vote],[data-remove-shop],[data-export-csv],[data-reset],[data-backup],[data-plan-unit],[data-entrance],[data-close-unit],[data-goto-finances],[data-more],[data-more-close],[data-review],[data-check],[data-clear-checks],[data-sample]');if(!x)return;
    if(x.hasAttribute('data-sample')){loadSample();return;}
    if(x.hasAttribute('data-check')){if(TEST_STEPS.some(q=>q.key===x.dataset.check)){db.testProgress[x.dataset.check]=!db.testProgress[x.dataset.check];persist();render();}return;}
    if(x.hasAttribute('data-clear-checks')){db.testProgress={};persist();render();return;}
    if(x.dataset.nav){db.tab=x.dataset.nav;db.search='';moreOpen=false;persist();render();window.scrollTo(0,0);return;}
    if(x.hasAttribute('data-more')){moreOpen=!moreOpen;render();return;}
    if(x.hasAttribute('data-more-close')){moreOpen=false;render();return;}
    if(x.hasAttribute('data-entrance')){const n=Number(x.dataset.entrance);if([1,2,3].includes(n)){db.entranceView=n;selectedUnit=null;persist();render();}return;}
    if(x.hasAttribute('data-plan-unit')){const n=Number(x.dataset.planUnit);if(!db.units.some(q=>q.number===n))return;if(!admin()&&db.flat!==n)return;selectedUnit=n;const rec=db.units.find(q=>q.number===n);if(rec.entrance)db.entranceView=rec.entrance;render();document.querySelector('.unit-details')?.scrollIntoView({block:'nearest',behavior:'smooth'});return;}
    if(x.hasAttribute('data-close-unit')){selectedUnit=null;render();return;}
    if(x.hasAttribute('data-goto-finances')){if(!admin())return;db.tab='finances';persist();render();window.scrollTo(0,0);return;}
    if(x.hasAttribute('data-review')){
      if(!admin())return notify(t('adminOnly'));
      if(!['approved','rejected'].includes(x.dataset.reviewStatus))return;
      const item=db.applications.find(q=>q.id===x.dataset.review&&q.status==='pending');
      if(!item)return;
      item.status=x.dataset.reviewStatus;
      persist();render();notify(t(item.status==='approved'?'requestApproved':'requestRejected'));return;
    }
    if(x.dataset.role){db.role=x.dataset.role;db.tab=x.hasAttribute('data-registration')?'registration':'home';selectedUnit=null;moreOpen=false;persist();render();return;}
    if(x.dataset.lang){db.lang=x.dataset.lang;persist();render();return;}
    if(x.hasAttribute('data-export-csv')){if(admin())csv();return;}
    if(x.hasAttribute('data-backup')){if(admin())download('rustaveli16-demo-backup.json','application/json',JSON.stringify(db,null,2));return;}
    if(x.hasAttribute('data-remove-shop')){if(!admin())return notify(t('adminOnly'));db.shops=db.shops.filter(q=>q.id!==x.dataset.removeShop);persist();render();notify(t('deleted'));return;}
    if(x.hasAttribute('data-vote')){if(admin())return notify(t('adminOnly'));const poll=db.polls.find(q=>q.id===x.dataset.vote);if(!poll)return;if(poll.voters.includes(db.flat))return notify(t('already'));if(!['yes','no'].includes(x.dataset.choice))return;poll[x.dataset.choice]++;poll.voters.push(db.flat);persist();render();notify(t('cast'));return;}
    if(x.hasAttribute('data-reset')&&admin()&&confirm(t('resetConfirm'))){db=seed();persist();render();notify(t('deleted'));}
  });
  render();
  if('serviceWorker'in navigator&&location.protocol==='https:'&&location.hostname==='zurabsamkharadze-png.github.io')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();

</script>
</body>
</html>
