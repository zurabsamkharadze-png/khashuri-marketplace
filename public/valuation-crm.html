<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRM заявок | Khashuri Marketplace</title>
<style>
:root{--teal:#11877c;--teal2:#0b6f67;--ink:#131c31;--muted:#70798b;--line:#e1e5ea;--bg:#f4f6f9;--soft:#eaf8f5;--red:#b63a3a;--amber:#a96500;--blue:#315fa8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:12px;align-items:center}.back{width:48px;height:48px;border:1px solid var(--line);background:#fff;border-radius:16px;font-size:27px;cursor:pointer}.top h1{font-size:23px;margin:0}.wrap{max-width:1120px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#10233c,#0b7d73);color:#fff;border-radius:28px;padding:25px;box-shadow:0 16px 45px rgba(16,35,60,.12)}.hero h2{font-size:32px;margin:0 0 8px}.hero p{margin:0;opacity:.9;line-height:1.45}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.kpi{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);border-radius:18px;padding:13px;color:#fff;text-align:left;cursor:pointer}.kpi small{display:block;opacity:.82}.kpi b{display:block;font-size:27px;margin-top:3px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 7px 24px rgba(20,32,50,.035)}.card h3{font-size:21px;margin:0 0 10px}.muted{color:var(--muted);line-height:1.45}.sharebox{display:flex;gap:8px}.sharebox input,.fieldInput{flex:1;min-width:0;border:1px solid var(--line);border-radius:13px;padding:12px 13px;font:inherit;background:#fff;color:var(--ink)}.btn{border:0;border-radius:14px;padding:11px 15px;background:var(--teal);color:#fff;font-weight:900;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn:hover{background:var(--teal2)}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.alt:hover{background:#f7f9fb}.btn.wa{background:#157a55}.btn.sm{padding:9px 11px;border-radius:12px;font-size:13px}.sectionHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.toolbar{display:grid;grid-template-columns:minmax(220px,1.7fr) repeat(4,minmax(120px,.8fr));gap:8px;margin-top:14px}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font:inherit;min-width:0}.subbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}.lead{border:1px solid var(--line);border-radius:19px;padding:16px;margin-top:11px;transition:.18s;background:#fff}.lead:hover{border-color:#cbd7d6;box-shadow:0 9px 24px rgba(17,135,124,.06)}.leadTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.lead h4{margin:0;font-size:20px}.contactLine{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:4px}.lead .price{font-size:25px;font-weight:950;margin:9px 0}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px 14px;color:#586173;font-size:13px}.meta b{color:var(--ink)}.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.pill{font-weight:850;padding:6px 9px;border-radius:999px;font-size:12px;background:var(--soft);color:#0c7169}.priority-low{background:#f1f3f6;color:#687080}.priority-normal{background:#eaf8f5;color:#0c7169}.priority-high{background:#fff1d8;color:#956000}.priority-urgent{background:#ffe6e6;color:#a62828}.follow{margin-top:10px;padding:9px 11px;border-radius:12px;background:#f8fafb;color:#5c6677;font-size:13px}.follow.due{background:#fff0e8;color:#9b4f19}.leadActions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:13px}.leadActions select{border:1px solid var(--line);border-radius:12px;padding:9px;background:#fff;font:inherit}.manager{display:grid;grid-template-columns:1fr 210px auto;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}.manager textarea{min-height:46px;resize:vertical}.empty{padding:24px;text-align:center;color:var(--muted)}.warn{background:#fff7e7;color:#945d00;border:1px solid #f1dfb8;border-radius:16px;padding:13px;line-height:1.45}.error{color:var(--red)}.modalBack{position:fixed;inset:0;z-index:50;background:rgba(9,17,30,.54);display:none;padding:16px;overflow:auto}.modalBack.open{display:grid;place-items:center}.modal{width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:0 25px 90px rgba(0,0,0,.25)}.modalHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.close{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:23px;cursor:pointer}.clientStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.clientStat{background:#f6f9fa;border-radius:14px;padding:11px}.clientStat small{display:block;color:var(--muted)}.clientStat b{font-size:20px}.historyItem{border-top:1px solid var(--line);padding:12px 0}.historyItem:first-child{border-top:0}.toast{position:fixed;right:16px;bottom:18px;z-index:80;background:#132238;color:#fff;border-radius:14px;padding:12px 15px;box-shadow:0 12px 40px rgba(0,0,0,.2);display:none}.toast.show{display:block}@media(max-width:850px){.toolbar{grid-template-columns:1fr 1fr}.meta{grid-template-columns:1fr 1fr}.manager{grid-template-columns:1fr 1fr}.manager textarea{grid-column:1/-1}.kpis{grid-template-columns:1fr 1fr}}@media(max-width:650px){.top h1{font-size:20px}.wrap{padding:12px}.sharebox{display:grid}.leadTop{display:grid}.badges{justify-content:flex-start}.meta{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.manager{grid-template-columns:1fr}.hero h2{font-size:28px}.clientStats{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.leadActions .btn{flex:1}}
</style>
</head>
<body>
<header class="top"><button class="back" onclick="history.length>1?history.back():location.href='/valuation'">←</button><h1>📥 CRM заявок</h1></header>
<main class="wrap">
<section class="hero"><h2>Продажи недвижимости</h2><p>Лиды после оценки, контакты, follow-up и история клиента в одном рабочем окне.</p><div class="kpis"><button class="kpi" data-kpi="new"><small>Новые</small><b id="kNew">0</b></button><button class="kpi" data-kpi="working"><small>В работе</small><b id="kWorking">0</b></button><button class="kpi" data-kpi="follow"><small>Нужен контакт</small><b id="kFollow">0</b></button><button class="kpi" data-kpi="closed"><small>Закрытые</small><b id="kClosed">0</b></button></div></section>
<section class="card"><h3>🔗 Персональная ссылка</h3><p class="muted">Отправь ссылку владельцу объекта. После оценки он сможет оставить контакт, и заявка появится здесь.</p><div class="sharebox"><input id="shareUrl" readonly placeholder="Загружаю персональную ссылку…"><button class="btn" id="copyBtn" type="button">Копировать</button></div><div id="shareMsg" class="muted" style="margin-top:8px"></div></section>
<section class="card"><div class="sectionHead"><div><h3 style="margin:0">Заявки</h3><div id="count" class="muted" style="margin-top:3px"></div></div><div style="display:flex;gap:7px"><button class="btn alt" id="csvBtn" type="button">CSV</button><button class="btn alt" id="refreshBtn" type="button">Обновить</button></div></div><div class="toolbar"><input id="search" placeholder="Поиск: имя, телефон, адрес, кадастр"><select id="filter"><option value="all">Все статусы</option><option value="new">Новые</option><option value="contacted">Связались</option><option value="working">В работе</option><option value="closed">Закрытые</option></select><select id="priorityFilter"><option value="all">Любой приоритет</option><option value="urgent">Срочно</option><option value="high">Высокий</option><option value="normal">Обычный</option><option value="low">Низкий</option></select><select id="cityFilter"><option value="all">Все города</option></select><select id="sort"><option value="newest">Сначала новые</option><option value="follow">Ближайший контакт</option><option value="value">Дорогие объекты</option></select></div><div id="state" class="empty">Загружаю…</div><div id="list"></div></section>
</main>
<div id="clientModal" class="modalBack"><section class="modal"><div class="modalHead"><div><h2 id="mName" style="margin:0"></h2><div id="mPhone" class="muted"></div></div><button class="close" id="modalClose">×</button></div><div id="mStats" class="clientStats"></div><div class="leadActions" id="mActions"></div><h3 style="margin:18px 0 5px">История обращений и оценок</h3><div id="mHistory"></div></section></div><div id="toast" class="toast"></div>
<script>
const SB='https://eppyjmtowtkxcwwhvwzp.supabase.co',KEY='sb_publishable_3oEkPaexOGYojb-9imVJjw_2SCQ7WRr';
const $=id=>document.getElementById(id),statusNames={new:'Новая',contacted:'Связались',working:'В работе',closed:'Закрыта'},priorityNames={low:'Низкий',normal:'Обычный',high:'Высокий',urgent:'Срочно'};let session=null,rows=[];
function safe(v){try{return JSON.parse(v||'null')}catch(e){return null}}function norm(x){if(!x)return null;return x.access_token?x:(x.currentSession||x.session||x.data?.session||null)}function payload(t){try{let s=String(t||'').split('.')[1].replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(atob(s))}catch(e){return{}}}
function sessions(){const out=[];for(const st of [sessionStorage,localStorage]){try{for(let i=0;i<st.length;i++){const k=st.key(i)||'',s=norm(safe(st.getItem(k)));if(!s?.access_token)continue;const p=payload(s.access_token),iss=String(p.iss||'');if(p.ref==='eppyjmtowtkxcwwhvwzp'||iss.includes('eppyjmtowtkxcwwhvwzp.supabase.co/auth/v1'))out.push(s)}}catch(e){}}return out.sort((a,b)=>Number(payload(b.access_token).exp||0)-Number(payload(a.access_token).exp||0))}
async function getSession(){for(const s of sessions()){try{const r=await fetch(SB+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+s.access_token}});if(r.ok)return s}catch(e){}}return null}
function auth(){return session?{apikey:KEY,Authorization:'Bearer '+session.access_token,'content-type':'application/json'}:{apikey:KEY,'content-type':'application/json'}}
async function token(){const r=await fetch(SB+'/rest/v1/rpc/get_or_create_valuation_public_token',{method:'POST',headers:auth(),body:'{}'});if(!r.ok)throw new Error('token '+r.status);let t=await r.json();return String(t||'').replace(/^"|"$/g,'')}
async function makeShare(){try{const t=await token(),url=location.origin+'/valuation/new?mode=precise&public=1&ref='+encodeURIComponent(t);$('shareUrl').value=url;$('shareMsg').textContent='✅ Персональная ссылка готова.'}catch(e){$('shareUrl').value='';$('shareMsg').innerHTML='<span class="error">Не удалось получить персональную ссылку.</span>'}}
async function load(){if(!session){$('state').innerHTML='<div class="warn">Нужно войти в Khashuri Marketplace под своим аккаунтом, чтобы открыть CRM.</div>';return}try{const r=await fetch(SB+'/rest/v1/valuation_leads?select=*&order=created_at.desc&limit=500',{headers:auth()});if(!r.ok)throw new Error('load '+r.status);rows=await r.json();fillCities();render()}catch(e){$('state').innerHTML='<div class="warn">Не удалось загрузить заявки. Обнови страницу или проверь подключение.</div>'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(v){return v?'$'+Math.round(Number(v)).toLocaleString('en-US'):'—'}function phoneKey(v){return String(v||'').replace(/\D/g,'').replace(/^00/,'')}function wa(v){const p=phoneKey(v);return p.length>=9?'https://wa.me/'+p:''}function fmt(v){return v?new Date(v).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}):'—'}function localInput(v){if(!v)return'';const d=new Date(v),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function fillCities(){const cur=$('cityFilter').value,cities=[...new Set(rows.map(x=>String(x.city||'').trim()).filter(Boolean))].sort();$('cityFilter').innerHTML='<option value="all">Все города</option>'+cities.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');if([...$('cityFilter').options].some(o=>o.value===cur))$('cityFilter').value=cur}
function due(x){return x.follow_up_at&&new Date(x.follow_up_at)<=new Date()&&x.status!=='closed'}function filtered(){const q=$('search').value.trim().toLowerCase(),st=$('filter').value,p=$('priorityFilter').value,c=$('cityFilter').value;let a=rows.filter(x=>(st==='all'||x.status===st)&&(p==='all'||(x.priority||'normal')===p)&&(c==='all'||x.city===c));if(q)a=a.filter(x=>[x.client_name,x.phone,x.address,x.cadastral_code,x.comment,x.manager_note].some(v=>String(v||'').toLowerCase().includes(q)));const s=$('sort').value;if(s==='follow')a.sort((x,y)=>(x.follow_up_at?+new Date(x.follow_up_at):Infinity)-(y.follow_up_at?+new Date(y.follow_up_at):Infinity));else if(s==='value')a.sort((x,y)=>Number(y.estimated_value||0)-Number(x.estimated_value||0));else a.sort((x,y)=>+new Date(y.created_at)-+new Date(x.created_at));return a}
function updateKpis(){const now=new Date();$('kNew').textContent=rows.filter(x=>x.status==='new').length;$('kWorking').textContent=rows.filter(x=>x.status==='working'||x.status==='contacted').length;$('kFollow').textContent=rows.filter(x=>x.follow_up_at&&new Date(x.follow_up_at)<=now&&x.status!=='closed').length;$('kClosed').textContent=rows.filter(x=>x.status==='closed').length}
function leadHtml(x){const w=wa(x.phone),p=x.priority||'normal',d=due(x);return `<article class="lead" data-id="${esc(x.id)}"><div class="leadTop"><div><h4>${esc(x.client_name)}</h4><div class="contactLine"><span class="muted">${esc(x.phone)}</span>${x.contact_method?`<span class="pill">${esc(x.contact_method)}</span>`:''}</div></div><div class="badges"><span class="pill priority-${esc(p)}">${priorityNames[p]||p}</span><span class="pill">${statusNames[x.status]||x.status}</span></div></div><div class="price">${money(x.estimated_value)}</div><div class="meta"><div><b>Кадастр:</b> ${esc(x.cadastral_code||'—')}</div><div><b>Город:</b> ${esc(x.city||'—')}</div><div><b>Адрес:</b> ${esc(x.address||'—')}</div><div><b>Цена владельца:</b> ${money(x.owner_price)}</div><div><b>Получено:</b> ${fmt(x.created_at)}</div><div><b>Последний контакт:</b> ${fmt(x.last_contact_at)}</div></div>${x.comment?`<p class="muted"><b>Комментарий клиента:</b> ${esc(x.comment)}</p>`:''}${x.follow_up_at?`<div class="follow ${d?'due':''}">📅 Следующий контакт: <b>${fmt(x.follow_up_at)}</b>${d?' · пора связаться':''}</div>`:''}<div class="leadActions"><select class="statusSel" data-id="${esc(x.id)}">${Object.entries(statusNames).map(([v,n])=>`<option value="${v}" ${v===x.status?'selected':''}>${n}</option>`).join('')}</select><select class="prioritySel" data-id="${esc(x.id)}">${Object.entries(priorityNames).map(([v,n])=>`<option value="${v}" ${v===p?'selected':''}>${n}</option>`).join('')}</select><a class="btn alt sm callBtn" data-id="${esc(x.id)}" href="tel:${esc(x.phone||'')}">📞 Позвонить</a>${w?`<a class="btn wa sm contactBtn" data-id="${esc(x.id)}" href="${esc(w)}" target="_blank" rel="noopener">WhatsApp</a>`:''}<button class="btn alt sm clientBtn" data-id="${esc(x.id)}">👤 Клиент</button></div><div class="manager"><textarea class="fieldInput noteInput" data-id="${esc(x.id)}" placeholder="Приватная заметка менеджера">${esc(x.manager_note||'')}</textarea><input class="fieldInput followInput" data-id="${esc(x.id)}" type="datetime-local" value="${localInput(x.follow_up_at)}"><button class="btn saveManager" data-id="${esc(x.id)}">Сохранить</button></div></article>`}
function render(){updateKpis();const a=filtered();$('state').style.display='none';$('count').textContent='Показано '+a.length+' из '+rows.length;$('list').innerHTML=a.length?a.map(leadHtml).join(''):'<div class="empty">По выбранным условиям заявок пока нет.</div>'}
async function patch(id,body,quiet=false){const r=await fetch(SB+'/rest/v1/valuation_leads?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...auth(),Prefer:'return=minimal'},body:JSON.stringify({...body,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error('patch '+r.status);const x=rows.find(v=>v.id===id);if(x)Object.assign(x,body);if(!quiet)render()}
async function setStatus(id,status){try{await patch(id,{status});toast('Статус обновлён')}catch(e){toast('Ошибка обновления статуса')}}async function setPriority(id,priority){try{await patch(id,{priority});toast('Приоритет обновлён')}catch(e){toast('Ошибка обновления')}}async function saveManager(id){const card=document.querySelector(`.lead[data-id="${CSS.escape(id)}"]`),note=card?.querySelector('.noteInput')?.value||'',fv=card?.querySelector('.followInput')?.value||'';try{await patch(id,{manager_note:note.trim()||null,follow_up_at:fv?new Date(fv).toISOString():null});toast('Заметка и follow-up сохранены')}catch(e){toast('Сохранить не удалось')}}async function touchContact(id){const x=rows.find(v=>v.id===id);if(!x)return;const body={last_contact_at:new Date().toISOString()};if(x.status==='new')body.status='contacted';try{await patch(id,body,true);updateKpis()}catch(e){}}
function openClient(id){const x=rows.find(v=>v.id===id);if(!x)return;const key=phoneKey(x.phone),hist=rows.filter(v=>phoneKey(v.phone)===key).sort((a,b)=>+new Date(b.created_at)-+new Date(a.created_at)),values=hist.map(v=>Number(v.estimated_value||0)).filter(Boolean),w=wa(x.phone);$('mName').textContent=x.client_name||'Клиент';$('mPhone').textContent=x.phone||'';$('mStats').innerHTML=`<div class="clientStat"><small>Обращений</small><b>${hist.length}</b></div><div class="clientStat"><small>Последняя оценка</small><b>${money(values[0])}</b></div><div class="clientStat"><small>Макс. оценка</small><b>${money(values.length?Math.max(...values):0)}</b></div>`;$('mActions').innerHTML=`<a class="btn alt" href="tel:${esc(x.phone||'')}">📞 Позвонить</a>${w?`<a class="btn wa" href="${esc(w)}" target="_blank" rel="noopener">WhatsApp</a>`:''}<button class="btn alt" id="copyPhone">Копировать телефон</button>`;$('mHistory').innerHTML=hist.map(v=>`<div class="historyItem"><b>${fmt(v.created_at)} · ${statusNames[v.status]||v.status}</b><div class="muted">${esc(v.city||'—')} · ${esc(v.address||'—')} · ${money(v.estimated_value)}</div>${v.cadastral_code?`<div class="muted">Кадастр: ${esc(v.cadastral_code)}</div>`:''}${v.manager_note?`<div style="margin-top:5px">📝 ${esc(v.manager_note)}</div>`:''}</div>`).join('');$('clientModal').classList.add('open');setTimeout(()=>{const b=$('copyPhone');if(b)b.onclick=()=>copyText(x.phone||'')},0)}
async function copyText(v){if(!v)return;try{await navigator.clipboard.writeText(v);toast('Скопировано')}catch(e){const ta=document.createElement('textarea');ta.value=v;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Скопировано')}}
function exportCsv(){const a=filtered(),cols=['created_at','client_name','phone','status','priority','city','address','cadastral_code','estimated_value','owner_price','follow_up_at','last_contact_at','manager_note'],cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"',csv='\ufeff'+cols.join(';')+'\n'+a.map(x=>cols.map(k=>cell(x[k])).join(';')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),aTag=document.createElement('a');aTag.href=url;aTag.download='valuation-crm-'+new Date().toISOString().slice(0,10)+'.csv';aTag.click();URL.revokeObjectURL(url)}
$('copyBtn').onclick=()=>copyText($('shareUrl').value);$('refreshBtn').onclick=load;$('csvBtn').onclick=exportCsv;['filter','priorityFilter','cityFilter','sort'].forEach(id=>$(id).onchange=render);$('search').oninput=render;$('list').addEventListener('change',e=>{const t=e.target;if(t.classList.contains('statusSel'))setStatus(t.dataset.id,t.value);if(t.classList.contains('prioritySel'))setPriority(t.dataset.id,t.value)});$('list').addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.classList.contains('saveManager'))saveManager(b.dataset.id);if(b.classList.contains('clientBtn'))openClient(b.dataset.id);if(b.classList.contains('callBtn')||b.classList.contains('contactBtn'))touchContact(b.dataset.id)});document.querySelectorAll('[data-kpi]').forEach(b=>b.onclick=()=>{const v=b.dataset.kpi;if(v==='follow'){$('filter').value='all';$('sort').value='follow'}else $('filter').value=v;render();document.querySelector('.card:last-of-type').scrollIntoView({behavior:'smooth'})});$('modalClose').onclick=()=>$('clientModal').classList.remove('open');$('clientModal').onclick=e=>{if(e.target===$('clientModal'))$('clientModal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('clientModal').classList.remove('open')});
(async()=>{session=await getSession();if(!session){$('state').innerHTML='<div class="warn">Сначала войди в аккаунт Khashuri Marketplace. После входа открой CRM снова.</div>';return}await makeShare();await load()})();
</script></body></html>
